<div class="product-form-container">
  <mat-card class="product-form-card">
    <mat-card-title>
      {{ isEdit ? 'Editar Producto' : 'Crear Producto' }}
    </mat-card-title>
    <mat-divider></mat-divider>

    <form [formGroup]="productForm" class="product-form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" required />
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Categoría</mat-label>
        <input matInput formControlName="category" required />
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Precio</mat-label>
        <input matInput type="number" formControlName="price" required min="0" />
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Stock</mat-label>
        <input matInput type="number" formControlName="stock" required min="0" />
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Descripción</mat-label>
        <textarea matInput formControlName="description"></textarea>
      </mat-form-field>

      <div class="form-actions">
        <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">
          {{ isEdit ? 'Actualizar' : 'Crear' }}
        </button>
        <button mat-button type="button" (click)="router.navigate(['/products'])">
          Cancelar
        </button>
      </div>

      <div *ngIf="isLoading" class="loading-spinner">
        <mat-spinner diameter="30"></mat-spinner>
      </div>
    </form>
  </mat-card>
</div>
