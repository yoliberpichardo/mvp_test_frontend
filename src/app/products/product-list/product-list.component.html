<div class="product-list-container">
  <div class="header-actions">
    <h2>Gestión de Productos</h2>
    <button *ngIf="isAdmin" mat-raised-button color="primary" routerLink="/products/new">
      <mat-icon>add</mat-icon> Crear Producto
    </button>
  </div>

  <mat-divider class="mb-20"></mat-divider>

  <div *ngIf="isLoading" class="loading-spinner">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!isLoading && products.length === 0" class="no-products">
    <mat-icon>inventory_2</mat-icon>
    <p>No hay productos disponibles</p>
  </div>

  <div *ngIf="!isLoading && products.length > 0" class="table-container">
    <table mat-table [dataSource]="products" class="mat-elevation-z8">
      <!-- Nombre Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let product"> {{ product.name }} </td>
      </ng-container>

      <!-- Categoría Column -->
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef> Categoría </th>
        <td mat-cell *matCellDef="let product"> {{ product.category }} </td>
      </ng-container>

      <!-- Precio Column -->
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef> Precio </th>
        <td mat-cell *matCellDef="let product"> {{ product.price | currency }} </td>
      </ng-container>

      <!-- Stock Column -->
      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef> Stock </th>
        <td mat-cell *matCellDef="let product"> {{ product.stock }} </td>
      </ng-container>

      <!-- Acciones Column -->
      <ng-container matColumnDef="actions" *ngIf="isAdmin">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let product">
          <button mat-icon-button color="primary" (click)="editProduct(product.id!)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteProduct(product.id!)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
